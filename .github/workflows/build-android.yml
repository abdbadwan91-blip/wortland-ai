name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (base /)
        run: npm run build:app
        # VITE_BASE intentionally unset so the Capacitor WebView loads from /

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/WortLand-AI.apk
          ls -lh out/WortLand-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WortLand-AI-apk
          path: out/WortLand-AI.apk
          if-no-files-found: error

      - name: Create or update android-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=android-latest
          TITLE="WortLand AI Android (latest debug build)"
          NOTES="$(cat <<'MD'
          Debug APK built by GitHub Actions from `main`.

          - **App ID:** `ai.wortland.app`
          - **Build type:** debug (unsigned for Play Store — allow installs from unknown sources)
          - Install: download `WortLand-AI.apk`, open it on your Android device, and allow the browser/file manager to install unknown apps if prompted.
          MD
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/WortLand-AI.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" out/WortLand-AI.apk \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
